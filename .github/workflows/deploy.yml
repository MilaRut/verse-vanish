name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Автоматический запуск при пуше в ветку main
  workflow_dispatch: # Возможность запустить вручную из интерфейса GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*" # Используем последнюю LTS версию Node.js
          cache: "npm"

      - name: Install dependencies
        run: npm ci # Более быстрая и чистая установка, чем npm install

      - name: Build project
        run: npm run build # Выполняет вашу команду сборки

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # Указываем папку, где Vite создает сборку

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
